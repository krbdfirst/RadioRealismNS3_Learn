<?xml version="1.0" encoding="UTF-8"?>

<!-- SUMO configuration for 40% CAV adoption rate.
     Route file: intersection_cav40.rou.xml
     veh_av probability = 40% of total car flow per route.
     veh_human = 60% — these run pure SUMO dynamics (no OMNeT++ module).
     Generated by make_cav_rate.py (rescaled from cav50) for CBR densification.
-->

<sumoConfiguration xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://sumo.dlr.de/xsd/sumoConfiguration.xsd">

    <input>
        <net-file value="intersection.net.xml"/>
        <route-files value="intersection_cav40.rou.xml"/>
        <additional-files value="intersection.poly.xml"/>
    </input>

    <time>
        <begin value="0"/>
        <end value="3000"/>
        <step-length value="0.1"/>
    </time>

    <processing>
        <ignore-route-errors value="true"/>
    </processing>

    <routing>
        <device.rerouting.adaptation-steps value="18"/>
        <device.rerouting.adaptation-interval value="10"/>
    </routing>

    <report>
        <verbose value="true"/>
        <xml-validation value="never"/>
        <xml-validation.net value="never"/>
        <duration-log.statistics value="true"/>
        <no-step-log value="true"/>
    </report>

</sumoConfiguration>
