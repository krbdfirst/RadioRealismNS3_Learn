[General]
network = InetScalarRadioScenario
sim-time-limit = 3000s
debug-on-errors = false     # true traps SIGINT on any cRuntimeError — breaks headless batch runs
cmdenv-express-mode = true
# No load-libs here. Runs go through $VEINS_ROOT/subprojects/veins_inet/bin/
# veins_inet_run, which ./configure generates with the local INET, Veins and
# veins_inet library, NED and image paths baked in, and passes them as -l/-n/
# --image-path. Hard-coding relative paths here would only work for one
# particular directory layout.
*.enableVisualizers = false
# Icons are only used by Qtenv; Cmdenv sweeps do not need them. The
# veins_inet_run wrapper already passes --image-path for the Veins and
# veins_inet image directories, so no image-path is set here. To add INET icons
# for a GUI run, append your INET images dir with --image-path on the command line.

# -----------------------------------------------------------------------------
# Result files
# Keep INET outputs separate from the original Veins-only runs.
# -----------------------------------------------------------------------------
result-dir = results/inet/${configname}-${runnumber}
output-scalar-file = ${resultdir}/${configname}-${runnumber}.sca
output-vector-file = ${resultdir}/${configname}-${runnumber}.vec
cmdenv-output-file = ${resultdir}/${configname}-${runnumber}.out

# -----------------------------------------------------------------------------
# Vehicle application wiring
# One custom INET V2X app per SUMO vehicle.
# -----------------------------------------------------------------------------
*.node[*].numApps = 1
*.node[*].app[0].typename = "org.car2x.veins.subprojects.veins_inet.VeinsInet5GVehicleApp"
*.node[*].app[0].interface = "wlan0"
*.node[*].app[0].manualVehicleType = "veh_human"   # SUMO type treated as manual / non-CAV
*.node[*].app[0].cavVehicleType = "veh_av"          # SUMO type treated as CAV
*.node[*].app[0].logGroundtruth = false              # Re-enable GroundTruthJSONlog.json and JSONlog-*.json outputs
*.node[*].app[0].channelTraceCsv = ""              # Optional MATLAB-generated NR PC5 PHY feature trace
*.node[*].app[0].activateChannelTrace = false      # When true, trace drives radio/link realism (PDR + air delay)
*.node[*].app[0].generalizedPhyCoeffDir = ""       # Optional fitted-equation runtime model exported from the 5G Toolbox pipeline
*.node[*].app[0].activateGeneralizedPhyModel = false  # When true, OMNeT computes PHY realism from the fitted equations

# -----------------------------------------------------------------------------
# Message timing and freshness
# beaconInterval / spatInterval are target generation rates; actual* are what
# the app really schedules. Keep them equal for a true 10 Hz setup.
# -----------------------------------------------------------------------------
*.node[*].app[0].beaconInterval = 0.1s
*.node[*].app[0].actualCamInterval = 0.1s
*.node[*].app[0].spatInterval = 0.1s
*.node[*].app[0].actualSpatInterval = 0.1s
*.node[*].app[0].authModeLabel = "INET_5G_Base"      # Label recorded with each run's results
*.node[*].app[0].authDelayMean = 0.0005s             # Mean auth processing time before a message can be used
*.node[*].app[0].authDelayStd = 0.0002s              # Jitter in auth processing time
*.node[*].app[0].authCacheWindow = 300s              # Generic auth cache lifetime (used when type-specific window not set)
*.node[*].app[0].authFreshnessWindow = 0.5s          # IEEE 1609.2 §6.3.9 / ETSI TS 103 097: 500 ms baseline
*.node[*].app[0].spatStaleTimeout = 0.5s             # Fail-safe timeout for stale SPAT control
*.node[*].app[0].spatLossPolicy = ""          # Explicit SPAT-loss policy: decelerate to minimal-risk near-stop sumo_fallback, safe_stop

# -----------------------------------------------------------------------------
# Receiver / OBU overload model
# CAM and SPAT compete for the same on-board processing budget.
# -----------------------------------------------------------------------------
*.node[*].app[0].obuCapacityPps = 600
*.node[*].app[0].capacityWindow = 1s
*.node[*].app[0].capacityDropSlope = 2.0
*.node[*].app[0].enableObuProcessingQueue = true
*.node[*].app[0].obuQueueMaxDepth = 0.5s
# Ieee80211 radio handles path loss at the radio layer. Skip analytical
# radio-layer drops to avoid double-counting. OBU capacity still applies.
*.node[*].app[0].bypassAnalyticalChannel = true

# -----------------------------------------------------------------------------
# Analytical PC5 loss and propagation model
# The generic analytical terms stay in place for half-duplex, SPS collisions,
# and residual background loss.
# The 3GPP branch below affects BOTH SPAT and CAM link delivery:
#   - SPAT uses an RSU-to-vehicle height model
#   - CAM uses a vehicle-to-vehicle height approximation
# Supported modes: current_analytical, tr38901_umi, tr38901_uma
# Trace integration note:
#   - Runs may set activateChannelTrace=true to replace the radio-link input
#     with MATLAB-generated NR PC5 PHY descriptors.
# -----------------------------------------------------------------------------
*.node[*].app[0].pc5AirDelayMean = 0.002s
*.node[*].app[0].pc5AirDelayStd = 0.0005s
*.node[*].app[0].pc5DropRate = 0.00000001        # calibrated — 3GPP TR 38.885 NR V2X Mode 2 urban
*.node[*].app[0].pc5Range = 300m
*.node[*].app[0].pc5HalfDuplexDrop = 0.000000    # calibrated — sparse network, near-zero HD loss
*.node[*].app[0].pc5SubchannelsPerSubframe = 9   # calibrated — low channel load
*.node[*].app[0].pc5ResourcesPerPacket = 1
*.node[*].app[0].pc5CandidateResourceFraction = 0.3850  # calibrated
*.node[*].app[0].sbspsReselectionInterval = 0.5s
*.node[*].app[0].pc5TxPowerDbm = 23
*.node[*].app[0].pc5SensingThresholdDbm = -94
*.node[*].app[0].pc5ShadowingStdDb = 3.6160      # calibrated — urban NR V2X (RMSE=0.012)
*.node[*].app[0].pc5PathLossExponent = 2.7995    # calibrated
*.node[*].app[0].pc5ReferenceLossDb = 47.9856    # calibrated
*.node[*].app[0].v2vPropagationModel = "tr38901_umi"
*.node[*].app[0].spatPropagationModel = "tr38901_umi"
*.node[*].app[0].spatCarrierFrequencyGHz = 5.9
*.node[*].app[0].spatBsHeight = 10m
*.node[*].app[0].spatUtHeight = 1.5m

# -----------------------------------------------------------------------------
# High-rate interferer (offered-load generator) — disabled by default
#
# One node transmits CAM at floodRate Hz instead of the nominal 10 Hz. This is
# the CONCENTRATED-load case used to validate that SB-SPS collision is driven by
# offered load rather than vehicle count alone: the same total load spread over
# many nodes must produce the same collision probability. See
# 06_analysis/python/extract_flood_validate.py and fit_contention_product.py,
# which fit the per-interferer collision factor q(rate, density) from these runs.
#
# The "attacker"/"target" parameter names are historical; here the node is simply
# a high-rate interferer and the target is the observed receiver.
# -----------------------------------------------------------------------------
*.node[*].app[0].enableFlooding = false
*.node[*].app[0].disguiseFloodAsCam = true
*.node[*].app[0].attackerVehicleId = "attacker_car"
*.node[*].app[0].targetVehicleId = "target_cav"
*.node[*].app[0].floodRate = 100
*.node[*].app[0].attackStartTime = 0s
*.node[*].app[0].attackDuration = 0s
*.node[*].app[0].targetRange = 320m

# -----------------------------------------------------------------------------
# RSU application wiring
# RSU broadcasts SPAT over the same INET wireless interface.
# -----------------------------------------------------------------------------
*.rsu[*].numApps = 1
*.rsu[*].app[0].typename = "org.car2x.veins.subprojects.veins_inet.VeinsInet5GRsuApp"
*.rsu[*].app[0].interface = "wlan0"
*.rsu[*].app[0].monitoredTlsId = "Junc1"
*.rsu[*].app[0].spatInterval = 0.1s
*.rsu[*].app[0].actualSpatInterval = 0.1s

# -----------------------------------------------------------------------------
# INET wireless shell
# This is still the current WLAN-backed hybrid shell, not a native NR stack.
# -----------------------------------------------------------------------------
*.node[*].wlan[0].opMode = "p"
*.rsu[*].wlan[0].opMode = "p"
*.node[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.rsu[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.node[*].wlan[0].radio.bandName = "5.9 GHz"
*.rsu[*].wlan[0].radio.bandName = "5.9 GHz"
*.node[*].wlan[0].radio.channelNumber = 3
*.rsu[*].wlan[0].radio.channelNumber = 3
*.node[*].wlan[0].radio.transmitter.power = 20mW
*.rsu[*].wlan[0].radio.transmitter.power = 20mW
*.node[*].wlan[0].radio.bandwidth = 10 MHz
*.rsu[*].wlan[0].radio.bandwidth = 10 MHz
*.node[*].wlan[*].radio.antenna.mobility.typename = "AttachedMobility"
*.rsu[*].wlan[*].radio.antenna.mobility.typename = "AttachedMobility"
*.node[*].wlan[*].radio.antenna.mobility.mobilityModule = "^.^.^.^.mobility"
*.rsu[*].wlan[*].radio.antenna.mobility.mobilityModule = "^.^.^.^.mobility"
*.node[*].wlan[*].radio.antenna.mobility.offsetX = -2.5m
*.rsu[*].wlan[*].radio.antenna.mobility.offsetX = 0m
*.node[*].wlan[*].radio.antenna.mobility.offsetZ = 1.5m
*.rsu[*].wlan[*].radio.antenna.mobility.offsetZ = 3m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMinX = 0m
*.rsu[*].wlan[*].radio.antenna.mobility.constraintAreaMinX = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMaxX = 0m
*.rsu[*].wlan[*].radio.antenna.mobility.constraintAreaMaxX = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMinY = 0m
*.rsu[*].wlan[*].radio.antenna.mobility.constraintAreaMinY = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMaxY = 0m
*.rsu[*].wlan[*].radio.antenna.mobility.constraintAreaMaxY = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMinZ = 0m
*.rsu[*].wlan[*].radio.antenna.mobility.constraintAreaMinZ = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMaxZ = 0m
*.rsu[*].wlan[*].radio.antenna.mobility.constraintAreaMaxZ = 0m

# -----------------------------------------------------------------------------
# INET IPv4 / multicast setup
# -----------------------------------------------------------------------------
*.node[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.rsu[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.node[*].ipv4.configurator.interfaces = "wlan0"
*.rsu[*].ipv4.configurator.interfaces = "wlan0"
*.node[*].ipv4.configurator.mcastGroups = "224.0.0.1"
*.rsu[*].ipv4.configurator.mcastGroups = "224.0.0.1"

# -----------------------------------------------------------------------------
# SUMO / TraCI bridge
# -----------------------------------------------------------------------------
*.node[*].mobility.typename = "VeinsInetMobility"
*.rsu[*].mobility.typename = "StationaryMobility"
*.rsu[0].mobility.initialX = 150.42m
*.rsu[0].mobility.initialY = 140.27m
*.rsu[0].mobility.initialZ = 3m
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.seed = -1    # Explicitly bind SUMO seed to the current OMNeT run number via TraCIScenarioManagerLaunchd
*.manager.launchConfig = xmldoc("intersection.launchd.xml")
# Instantiate INET hosts only for equipped vehicles.
# All other traffic participants still exist in SUMO and influence mobility,
# but they do not carry an OMNeT/INET network stack.
*.manager.moduleType = "veh_av=org.car2x.veins.subprojects.veins_inet.VeinsInetCar veh_human=org.car2x.veins.subprojects.veins_inet.VeinsInetLiteCar *=0"
*.manager.moduleName = "veh_av=node veh_human=node *=0"
*.manager.moduleDisplayString = ""

# Manual vehicles get a telemetry-only app — no V2X transmission, no SPAT control.
# manualMode_ is now resolved at runtime from the SUMO vehicle type; the lines
# below are belt-and-suspenders: they suppress IPv4 configuration and the radio
# transmitter so human nodes write zero packets to the channel.
*.node[*].app[0].cavVehicleType    = "veh_av"
*.node[*].app[0].manualVehicleType = "veh_human"
# Suppress HostAutoConfigurator for human vehicles (they never use the radio)
# by not giving them a multicast subscription — handled at runtime via manualMode_.

# -----------------------------------------------------------------------------
# Environment and recording
# -----------------------------------------------------------------------------
*.physicalEnvironment.config = xmldoc("config.xml")
*.radioMedium.obstacleLoss.typename = "IdealObstacleLoss"
**.vector-recording = false

# =============================================================================
# Ideal* configs — MATLAB-calibrated analytical model testbed
#
# These configs use IdealPc5Scenario.ned (Ieee80211DimensionalRadioMedium
# configured as a transparent channel). The radio delivers all packets within
# range without any PHY-layer drops. All PC5 channel characteristics
# (path loss, half-duplex, SPS collision, OBU capacity) come exclusively from
# the analytical model in VeinsInet5GVehicleApp (bypassAnalyticalChannel=false).
# Parameters are calibrated against 3GPP TR 38.885 NR V2X Mode 2 urban.
# =============================================================================

[Config IdealSmoke]
network = IdealPc5Scenario
description = "Smoke test — transparent Ieee80211 radio, full calibrated analytical 5G model"
repeat = 3
seed-set = ${repetition}

# Make the radio layer transparent: high TX power + very low sensitivity so
# the Ieee80211 PHY never drops a packet within range. The app-layer
# analytical model (bypassAnalyticalChannel=false) is the sole PDR gatekeeper.
*.node[*].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.rsu[*].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.node[*].wlan[0].radio.transmitter.power = 200mW
*.rsu[*].wlan[0].radio.transmitter.power = 200mW
*.node[*].wlan[0].radio.receiver.sensitivity = -110dBm
*.rsu[*].wlan[0].radio.receiver.sensitivity = -110dBm
*.node[*].wlan[0].radio.receiver.snirThreshold = -100dB
*.rsu[*].wlan[0].radio.receiver.snirThreshold = -100dB
*.node[*].app[0].bypassAnalyticalChannel = false
*.node[*].app[0].generalizedPhyCoeffDir = "model_coefficients/phy_5gtoolbox"
*.node[*].app[0].activateGeneralizedPhyModel = true
*.node[*].app[0].pc5NoiseFigureDb = 7
*.node[*].app[0].pc5BandwidthHz = 18.72e6
*.node[*].app[0].pc5ShadowCorrelationWindow = 1s


# =============================================================================
# PHY-model data sweep — 6 adoption levels × 5 seeds = 30 runs
#
# Purpose:
#   Produce geometry/CAV-pair logs for generalized MATLAB PHY-model fitting.
#   The radio layer is transparent and the app-layer analytical channel is
#   bypassed, so the logged CAV-pair geometry is a clean input for fitting:
#   - no flooding
#   - CAV pair logger enabled for MATLAB ingestion
# =============================================================================

[Config Ideal_PHYModel_Base]
extends = IdealSmoke
description = "PHY-model geometry sweep base"
sim-time-limit = 300s
repeat = 6
seed-set = ${repetition}
# Signing/verification overhead retained from the original ECDSA-timed sweep so
# the recorded app-layer latencies stay comparable with previously fitted data.
*.node[*].app[0].authModeLabel = "Ideal_PHYModel"
*.node[*].app[0].authDelayMean = 0.002s
*.node[*].app[0].authDelayStd = 0.0005s
*.node[*].app[0].authCacheWindow = 300s
*.node[*].app[0].authFreshnessWindow = 0.5s      # IEEE 1609.2 §6.3.9 normative value
*.node[*].app[0].enableFlooding = false
*.node[*].app[0].activateChannelTrace = false
*.node[*].app[0].generalizedPhyCoeffDir = ""
*.node[*].app[0].activateGeneralizedPhyModel = false
*.node[*].app[0].bypassAnalyticalChannel = true
*.node[*].app[0].obuCapacityPps = 1e9
*.node[*].app[0].capacityDropSlope = 0
*.node[*].app[0].logCavLinkTrace = true

[Config Ideal_PHYModel_CAV01]
extends = Ideal_PHYModel_Base
description = "1% CAV adoption — PHY-model data sweep"
*.manager.launchConfig = xmldoc("intersection_cav01.launchd.xml")

[Config Ideal_PHYModel_CAV05]
extends = Ideal_PHYModel_Base
description = "5% CAV adoption — PHY-model data sweep"
*.manager.launchConfig = xmldoc("intersection_cav05.launchd.xml")

[Config Ideal_PHYModel_CAV10]
extends = Ideal_PHYModel_Base
description = "10% CAV adoption — PHY-model data sweep"
*.manager.launchConfig = xmldoc("intersection_cav10.launchd.xml")

[Config Ideal_PHYModel_CAV25]
extends = Ideal_PHYModel_Base
description = "25% CAV adoption — PHY-model data sweep"
*.manager.launchConfig = xmldoc("intersection_cav25.launchd.xml")

[Config Ideal_PHYModel_CAV50]
extends = Ideal_PHYModel_Base
description = "50% CAV adoption — PHY-model data sweep"
*.manager.launchConfig = xmldoc("intersection_cav50.launchd.xml")

[Config Ideal_PHYModel_CAV75]
extends = Ideal_PHYModel_Base
description = "75% CAV adoption — PHY-model data sweep"
*.manager.launchConfig = xmldoc("intersection_cav75.launchd.xml")

[Config Ideal_PHYModel_CAV90]
extends = Ideal_PHYModel_Base
description = "90% CAV adoption — PHY-model data sweep"
*.manager.launchConfig = xmldoc("intersection_cav90.launchd.xml")

[Config Ideal_PHYModel_CAV100]
extends = Ideal_PHYModel_Base
description = "100% CAV adoption — PHY-model data sweep"
*.manager.launchConfig = xmldoc("intersection_cav100.launchd.xml")

# =============================================================================
# =============================================================================
# PROPAGATION-REALISM COMPARISON SWEEP   (PropagationRealismProject)
#
# Purpose: cross-validate three OMNeT/Veins 5G NR PC5 propagation treatments
#          against NS-3 5G LENA, using a clean BASELINE (no background
#          interferer, no crypto-auth delay, no OBU overload). This isolates the
#          *channel/communication behavior* so the only thing that differs
#          between treatments is the propagation model.
#
#  Treatment    | network                | radio               | bypassAnalytical | generalized | v2vPropagationModel
#  -------------+------------------------+---------------------+------------------+-------------+--------------------
#  Plain        | InetScalarRadioScenario  | Ieee80211ScalarRadio| true             | false       | (radio is the channel)
#  Analytical   | IdealPc5Scenario | Dimensional (transp)| false            | false       | tr38901_umi  (3GPP TR 38.901 UMi — literature/previous-research)
#  Calibrated   | IdealPc5Scenario | Dimensional (transp)| false            | false       | current_analytical (MATLAB-calibrated pc5* — calibrate_5g_pc5.m)
#  Generalized  | IdealPc5Scenario | Dimensional (transp)| false            | true        | (5G Toolbox fitted equations)
#
# Source of truth in code: VeinsInet5GVehicleApp.cc
#   - line ~1834: app-layer channel only applied when bypassAnalyticalChannel=false
#   - getLinkPacketSensingRatio() dispatch order: generalized -> trace -> tr38901_* -> calibrated log-distance
#
# Adoption rates: 1 / 5 / 25 / 50 / 75 / 100 %   (uses existing intersection_cavNN.launchd.xml)
# Run all 24 via:   run_propagation_compare.sh
# NS-3 mobility ground truth comes from run_sumo_fcd_for_ns3.sh (plain SUMO FCD).
# =============================================================================

[Config Prop_Common_Base]
description = "Common comparison baseline — no auth-crypto delay, no OBU overload"
sim-time-limit = 200s    # matched to NS-3; cav75/cav100 leaf configs override to 60s for tractability
repeat = 5
seed-set = ${repetition}
# Bind SUMO RNG to the OMNeT run so each repetition is reproducible and can be
# mirrored by run_sumo_fcd_for_ns3.sh (same seed => same vehicle trajectories).
*.manager.seed = ${repetition}
# --- no background/interfering traffic generator ---
*.node[*].app[0].enableFlooding = false
# --- remove crypto-auth confound: compare channel/MAC behavior only (NS-3 LENA has no app crypto) ---
*.node[*].app[0].authDelayMean = 0s
*.node[*].app[0].authDelayStd = 0s
*.node[*].app[0].authModeLabel = "Prop_Compare_Base"
# --- remove receiver-overload confound ---
*.node[*].app[0].obuCapacityPps = 1e9
*.node[*].app[0].capacityDropSlope = 0
*.node[*].app[0].enableObuProcessingQueue = false
# --- 10 Hz CAM, de-synchronized first beacon (see scheduleCam first-jitter) ---
*.node[*].app[0].beaconInterval = 0.1s
*.node[*].app[0].actualCamInterval = 0.1s

# -----------------------------------------------------------------------------
# Treatment anchors
# -----------------------------------------------------------------------------
[Config Prop_Plain]
extends = Prop_Common_Base
description = "PLAIN OMNeT+INET+Veins — INET Ieee80211 scalar radio is the ONLY channel model (all calibration/analytical/generalized OFF)"
network = InetScalarRadioScenario
*.node[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.rsu[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"
*.node[*].app[0].bypassAnalyticalChannel = true
*.node[*].app[0].activateChannelTrace = false
*.node[*].app[0].activateGeneralizedPhyModel = false
*.node[*].app[0].generalizedPhyCoeffDir = ""

[Config Prop_Analytical]
extends = Prop_Common_Base
description = "Style 1 — 3GPP TR 38.901 UMi analytical model (literature / previous research), transparent INET radio"
network = IdealPc5Scenario
*.node[*].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.rsu[*].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.node[*].wlan[0].radio.transmitter.power = 200mW
*.rsu[*].wlan[0].radio.transmitter.power = 200mW
*.node[*].wlan[0].radio.receiver.sensitivity = -110dBm
*.rsu[*].wlan[0].radio.receiver.sensitivity = -110dBm
*.node[*].wlan[0].radio.receiver.snirThreshold = -100dB
*.rsu[*].wlan[0].radio.receiver.snirThreshold = -100dB
*.node[*].app[0].bypassAnalyticalChannel = false
*.node[*].app[0].activateChannelTrace = false
*.node[*].app[0].activateGeneralizedPhyModel = false
*.node[*].app[0].generalizedPhyCoeffDir = ""
*.node[*].app[0].v2vPropagationModel = "tr38901_umi"
*.node[*].app[0].spatPropagationModel = "tr38901_umi"
# LOS-only study: drop building-NLOS / vehicle-NLOSv across Analytical, Generalized, NS3Learn
# (inherited via extends). Matches the NS-3 UMi_StreetCanyon_LoS reference.
*.node[*].app[0].losOnly = true

# ── Combined Analytical Reference (Cao 2026 + Rehman 2023), paper Eq. m3 ──────────
# The published-analytical baseline for the study. Depends on BOTH density (Cao
# SB-SPS collision + half-duplex) and distance (Rehman noise-limited decode over
# 3GPP TR 37.885 V2V-Urban + an independent 5G-Toolbox CDL BLER curve). TR 37.885 is
# the SAME channel NS-3/ns3learn use, so the comparison isolates the contention /
# capture / fitting differences, not the channel. Assembled without double counting
# (Model 2 is noise-limited; contention lives only in Model 1). Not calibrated to
# NS-3 — the discrepancy vs NS3Learn is the object of study.
# NOTE on the BLER curve: bler_curve_cdl_c.csv is a 5G-Toolbox link-level curve at
# QPSK, target code rate 490/1024 (= CQI 6 / MCS 8, the same setup as Cao's PHY-
# abstraction paper). This is INDEPENDENT of the NS-3 teacher (which runs MCS 14),
# by design, so the analytical baseline borrows nothing from the ground truth. Being
# a lower (more robust) MCS, it is slightly optimistic at the cell edge; negligible
# mid-range on the generous V2V channel (SNR stays well above the ~2 dB knee).
[Config Prop_Analytical_M3]
extends = Prop_Analytical
description = "Combined Analytical Reference — Cao SB-SPS collision (density) x Rehman decode (distance)"
*.node[*].app[0].realismModel = "analytical_m3"
*.node[*].app[0].m3BlerCurveCsv = "model_coefficients/phy_5gtoolbox/bler_curve_cdl_c.csv"
*.node[*].app[0].losOnly = false

[Config Prop_Analytical_Col]
extends = Prop_Analytical_M3
description = "Ablation — contention-only (Cao Model 1: half-duplex + SB-SPS collision, no decode loss)"
*.node[*].app[0].realismModel = "analytical_col"

[Config Prop_Analytical_Prop]
extends = Prop_Analytical_M3
description = "Ablation — propagation-only (Rehman Model 2: noise-limited decode, no MAC contention)"
*.node[*].app[0].realismModel = "analytical_prop"

# RETIRED 2026-07: the MATLAB-calibrated log-distance PC5 model (calibrate_5g_pc5.m /
# current_analytical) is superseded by the Combined Analytical Reference above and is
# NO LONGER in the headline run set (now Analytical_M3 + NS3Learn). The config block is
# kept defined only so its legacy Prop_Calibrated_CAV* leaves do not dangle; do not run it.
[Config Prop_Calibrated]
extends = Prop_Analytical
description = "RETIRED — MATLAB-calibrated log-distance PC5 model (superseded by Prop_Analytical_M3)"
*.node[*].app[0].v2vPropagationModel = "current_analytical"
*.node[*].app[0].spatPropagationModel = "current_analytical"
*.node[*].app[0].pc5PathLossExponent = 2.7995
*.node[*].app[0].pc5ReferenceLossDb = 47.9856
*.node[*].app[0].pc5ShadowingStdDb = 3.6160

[Config Prop_Generalized]
extends = Prop_Analytical
description = "Style 3 — 5G Toolbox generalized fitted PHY model (runtime coefficients)"
*.node[*].app[0].activateGeneralizedPhyModel = true
*.node[*].app[0].generalizedPhyCoeffDir = "model_coefficients/phy_5gtoolbox"
*.node[*].app[0].pc5NoiseFigureDb = 7
*.node[*].app[0].pc5BandwidthHz = 18.72e6
*.node[*].app[0].pc5ShadowCorrelationWindow = 1s

[Config Prop_NS3Learn]
extends = Prop_Analytical
description = "Style 4 — NS-3 5G-LENA-distilled realism (V2V BLER + resource-collision + half-duplex) via realismModel=ns3learn"
# Pin the channel: the ns3learn cascade is trained on TR 37.885 V2V_Urban, NOT the
# UMi-LOS that Prop_Analytical sets. losOnly=false routes ns3LearnReception through
# v2vChannelPathLossDb (V2V). Without this override it would inherit losOnly=true
# (UMi-LOS) and silently NOT reproduce the validated results. (_MS50 inherits this.)
*.node[*].app[0].losOnly = false
*.node[*].app[0].realismModel = "ns3learn"
*.node[*].app[0].ns3LearnCoeffDir = "model_coefficients/ns3learn_runtime"
*.node[*].app[0].pc5NoiseFigureDb = 7
*.node[*].app[0].pc5BandwidthHz = 18.72e6

