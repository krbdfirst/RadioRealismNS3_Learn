[Config Prop_NS3Learn_Net_CAV50]
extends = Prop_NS3Learn_CAV50
sim-time-limit = 100s
*.node[*].app[0].activateFailsafe = "MRM,ACC"   # both responses; "" would mean NO fail-safe at all
# Pinned explicitly rather than inherited from the .ned defaults, so this study's behaviour is
# reproducible and does not silently track default changes made for other projects sharing the
# app. Values follow the 2026-07-27 convention: both applications require the same weight of
# evidence (5 consecutive missed messages at 10 Hz) before declaring their feeding link lost.
*.node[*].app[0].camStaleTimeout = 0.5s          # 5 missed CAM  -> CACC degrades to ACC
*.node[*].app[0].spatHandoverTime = 0s           # no separate handover stage; the 5-missed-SPaT
                                                 # detection window IS the grace period
*.node[*].app[0].mrmActivationDistance = 35m     # MRM engages only within 35 m of the stop line,
                                                 # the distance at which a comfortable 3 m/s^2
                                                 # halt from 13.9 m/s is still achievable
*.node[*].app[0].enableCamCacc = true          # leader-CAM -> CACC/ACC; SPaT+CAM lost near TLS -> stop

[Config Prop_Analytical_M3_Net_CAV50]
extends = Prop_Analytical_M3_CAV50
sim-time-limit = 100s
*.node[*].app[0].enableCamCacc = true          # leader-CAM -> CACC/ACC; SPaT+CAM lost near TLS -> stop

