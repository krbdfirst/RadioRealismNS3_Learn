<rect x="334" y="101" width="228" height="66" rx="5" fill="white" stroke="#BFDBFE" stroke-width="1"/>
<text x="448" y="118" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8">OMNeT++ V2X Simulation</text>
<text x="448" y="134" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#374151">VeinsInet5GVehicleApp</text>
<text x="448" y="149" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#374151">logCavLinkTrace → per-pair geometry</text>

<rect x="576" y="101" width="228" height="66" rx="5" fill="white" stroke="#BFDBFE" stroke-width="1"/>
