<rect x="80" y="200" width="740" height="29"  fill="#F97316" clip-path="url(#cp2)"/>
<text x="450" y="219" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
      font-size="12.5" font-weight="bold" fill="white">
  ② MATLAB Feature Engineering
</text>

<rect x="92"  y="236" width="228" height="66" rx="5" fill="white" stroke="#FED7AA" stroke-width="1"/>
<text x="206" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#C2410C">Geometry Predictors (×6)</text>
<text x="206" y="269" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#374151">log₁₀(d) · v_rel · v_radial · |v_radial|</text>
<text x="206" y="284" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#374151">cos(Δheading) · p_LOS</text>

<rect x="334" y="236" width="228" height="66" rx="5" fill="white" stroke="#FED7AA" stroke-width="1"/>
<text x="448" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#C2410C">3GPP TR 38.901 UMi</text>
<text x="448" y="269" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#374151">LOS: 32.4 + 21·log₁₀(d₃D) + 20·log₁₀(f)</text>
<text x="448" y="284" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#374151">p_LOS = 18/d + e^(−d/36)·(1−18/d)</text>

<rect x="576" y="236" width="228" height="66" rx="5" fill="white" stroke="#FED7AA" stroke-width="1"/>
<text x="690" y="253" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="bold" fill="#C2410C">Stratified Sampling</text>
<text x="690" y="269" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#374151">distance × rel_speed × radial_vel</text>
<text x="690" y="284" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#374151">max 2 500 rows / run</text>

