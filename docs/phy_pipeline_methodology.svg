<text x="448" y="419" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#374151">f_c = 5.9 GHz · P_tx = 23 dBm</text>

<rect x="576" y="371" width="228" height="66" rx="5" fill="white" stroke="#FEF08A" stroke-width="1"/>
